name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: build-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: provenex-ingest-${{ github.ref_name }}-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: provenex-ingest-${{ github.ref_name }}-linux-aarch64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: provenex-ingest-${{ github.ref_name }}-darwin-aarch64.tar.gz
    # x86_64-apple-darwin (Intel macOS) was previously in this matrix on
    # macos-13. The free-tier macos-13 runner queue is unreliable for new
    # GitHub orgs (45-90 min vs. the 1-2 min the build actually takes),
    # which kept blocking the release job. Intel macOS users represent a
    # shrinking share of the userbase; cargo install (which compiles
    # native to whatever arch the user runs) covers them cleanly. Re-add
    # the matrix entry once macos-13 queue behavior is fixed.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: install cross-compiler (linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "[target.aarch64-unknown-linux-gnu]" >> ~/.cargo/config.toml
          echo "linker = \"aarch64-linux-gnu-gcc\"" >> ~/.cargo/config.toml
      - run: cargo build --release --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/provenex-ingest dist/
          cp README.md LICENSE dist/
          cd dist
          tar -czf ../${{ matrix.artifact }} *
          cd ..
          shasum -a 256 ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
          generate_release_notes: true

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/provenex/provenex-ingest:latest
            ghcr.io/provenex/provenex-ingest:${{ github.ref_name }}
